    <title>Blindspot | Digital Marketing Agency in West Sussex</title>
    <meta name="description" content="Blindspot is a specialist marketing agency for local service businesses. We build automated content and SEO systems that compound growth over time." />
    <script type="text/javascript">
      // GitHub Pages SPA redirect — restore clean URL from 404.html redirect
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname + decoded + l.hash
          );
        }
      }(window.location))
    </script>
